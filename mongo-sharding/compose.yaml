name: mongo-sharding

services:
  configSrv:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "configRs", "--port", "27019", "--bind_ip_all", "--dbpath", "/data/db", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - configsrv-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  shard1-1:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1Rs", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1-1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  shard2-1:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2Rs", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2-1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongos:
    image: mongo:7.0
    command: ["mongos", "--configdb", "configRs/configSrv:27019", "--bind_ip_all", "--port", "27017"]
    depends_on:
      configSrv:
        condition: service_healthy
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0
    entrypoint: ["mongosh", "--nodb", "--quiet", "--file", "/init.js"]
    volumes:
      - ./init.js:/init.js:ro
    depends_on:
      configSrv:
        condition: service_healthy
      shard1-1:
        condition: service_healthy
      shard2-1:
        condition: service_healthy
      mongos:
        condition: service_started
    restart: "no"

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017/?retryWrites=true&w=majority"
      MONGODB_DATABASE_NAME: "somedb"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  configsrv-data:
  shard1-1-data:
  shard2-1-data:
